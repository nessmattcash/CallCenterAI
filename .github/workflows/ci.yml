name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install fastapi uvicorn httpx psutil prometheus-client pytest requests
        if [ -f "requirements.txt" ]; then pip install -r requirements.txt; fi
        if [ -f "req.txt" ]; then pip install -r req.txt; fi
        if [ -f "requirements-dev.txt" ]; then pip install -r requirements-dev.txt; fi
    
    - name: Run tests
      run: |
        pytest tests/ -v --tb=short
    
  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install linting tools
      run: |
        pip install black flake8 isort
    
    - name: Check code formatting
      run: |
        black --check src/ tests/
    
    - name: Check imports
      run: |
        isort --check-only src/ tests/
    
    - name: Lint with flake8
      run: |
        flake8 src/ tests/ --max-line-length=88 --count
    
  security:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install security tools
      run: |
        pip install bandit
    
    - name: Run bandit security scan
      run: |
        bandit -r src/
    
    - name: Run Trivy scan
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
    
    - name: Upload Trivy results
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'

  build:
    runs-on: ubuntu-latest
    needs: [test, lint, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    
    - name: Build and push TF-IDF image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./docker/Dockerfile.tfidf
        push: true
        tags: |
          theone12/callcenterai-tfidf:latest
          theone12/callcenterai-tfidf:${{ github.sha }}
    
    - name: Build and push Transformer image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./docker/Dockerfile.transformer
        push: true
        tags: |
          theone12/callcenterai-transformer:latest
          theone12/callcenterai-transformer:${{ github.sha }}
    
    - name: Build and push Agent image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./docker/Dockerfile.agent
        push: true
        tags: |
          theone12/callcenterai-agent:latest
          theone12/callcenterai-agent:${{ github.sha }}